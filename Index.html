<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMES ARENA💫 — Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #d9d9d9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 390px;
      min-height: 100vh;
      background: #f5f5f5;
      position: relative;
      overflow: hidden;
    }

    header {
      height: 70px;
      background: #075e54;
      color: white;
      display: flex;
      align-items: center;
      padding: 10px;
      gap: 10px;
    }

    button {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .back {
      font-size: 30px;
    }

    .menu {
      margin-left: auto;
      font-size: 28px;
    }

    .avatar,
    .big-avatar,
    .small-avatar {
      background: #222;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 45px;
      height: 45px;
      font-size: 22px;
    }

    .channel-info h2 {
      font-size: 16px;
    }

    .channel-info p {
      font-size: 12px;
      opacity: .8;
    }

    .demo {
      background: #fff3cd;
      color: #856404;
      text-align: center;
      padding: 8px;
      font-size: 10px;
      font-weight: bold;
    }

    .profile {
      background: white;
      text-align: center;
      padding: 28px 15px;
    }

    .big-avatar {
      width: 100px;
      height: 100px;
      margin: auto;
      font-size: 48px;
    }

    .profile h1 {
      margin-top: 15px;
      font-size: 23px;
    }

    .handle {
      color: #777;
      margin-top: 5px;
    }

    .followers {
      margin: 20px 0;
    }

    .followers strong {
      display: block;
      font-size: 32px;
    }

    .followers span {
      color: #777;
    }

    .follow {
      display: block;
      width: 90%;
      margin: auto;
      padding: 13px;
      border-radius: 25px;
      background: #25d366;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: white;
      margin-top: 8px;
      padding: 18px 5px;
    }

    .stats div {
      text-align: center;
    }

    .stats strong {
      display: block;
      font-size: 18px;
    }

    .stats span {
      color: #777;
      font-size: 11px;
    }

    .post {
      background: white;
      margin-top: 8px;
      padding: 15px;
      padding-bottom: 80px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .small-avatar {
      width: 42px;
      height: 42px;
      font-size: 20px;
    }

    .post-header small {
      display: block;
      color: #888;
      margin-top: 3px;
    }

    .post p {
      margin-top: 15px;
      line-height: 1.5;
    }

    .actions {
      border-top: 1px solid #eee;
      margin-top: 15px;
      padding-top: 12px;
      color: #666;
      font-size: 13px;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 390px;
      max-width: 100%;
      height: 60px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <div class="phone">

    <header>
      <button class="back" onclick="history.back()">‹</button>

      <div class="avatar">😂</div>

      <div class="channel-info">
        <h2>MEMES ARENA💫</h2>
        <p>Channel</p>
      </div>

      <button class="menu">⋮</button>
    </header>

    <div class="demo">
      DEMO — SIMULATED FOLLOWER COUNT
    </div>

    <main>

      <section class="profile">

        <div class="big-avatar">😂</div>

        <h1>MEMES ARENA💫</h1>

        <p class="handle">@MEMESARENA</p>

        <div class="followers">
          <strong id="followers">250,000</strong>
          <span>followers</span>
        </div>

        <a
          class="follow"
          href="https://whatsapp.com/channel/0029Vb7NsGg4SpkMjEckfL3S"
          target="_blank">
          Follow on WhatsApp
        </a>

      </section>

      <section class="stats">

        <div>
          <strong>250K</strong>
          <span>Followers</span>
        </div>

        <div>
          <strong>98%</strong>
          <span>Active</span>
        </div>

        <div>
          <strong>24/7</strong>
          <span>Memes</span>
        </div>

      </section>

      <section class="post">

        <div class="post-header">

          <div class="small-avatar">😂</div>

          <div>
            <strong>MEMES ARENA💫</strong>
            <small>Today</small>
          </div>

        </div>

        <p>
          😂 Welcome to MEMES ARENA💫
          <br><br>
          Daily memes, funny videos and crazy moments! 🔥🤣
        </p>

        <div class="actions">
          ❤️ 25K &nbsp;&nbsp;
          😂 18K &nbsp;&nbsp;
          👍 12K
        </div>

      </section>

    </main>

    <footer>
      <span>⌂</span>
      <span>◉</span>
      <span>◌</span>
      <span>⚙</span>
    </footer>

  </div>

</body>
  </html>
